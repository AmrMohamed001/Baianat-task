
services:
  server:
    container_name: server-container
    build:
      context: .
      dockerfile: Dockerfile
      target: development 
    volumes:
      - ./src:/task-app/src
    env_file:
      - path: ./.env
        format: raw
    # environment:
    #   DB_HOSTER: db
    #   DB_PORT: 5432
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7
    restart: always
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: postgres:16
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - 5432
    ports:
      - 5433:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  localstack:
    image: localstack/localstack:4.12
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - S3_BUCKET=${S3_BUCKET}
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d

volumes:
  db-data:
